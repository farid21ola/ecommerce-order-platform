services:
  notification-service:
    build:
      context: .
      args:
        SERVICE: notification-service
    container_name: ecommerce-notification-service
    environment:
      SERVICE_NAME: notification-service
      HTTP_PORT: 8086
      DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/notification_db?sslmode=disable
      KAFKA_GROUP_ID: notification-service
      NOTIFICATION_SERVICE_ADDR: :8086
      NOTIFICATION_DB_HOST: postgres
      NOTIFICATION_DB_PORT: 5432
      NOTIFICATION_DB_USER: ecommerce
      NOTIFICATION_DB_PASSWORD: ecommerce
      NOTIFICATION_DB_NAME: notification_db
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    container_name: ecommerce-api-gateway
    environment:
      SERVICE_NAME: api-gateway
      HTTP_PORT: 8080
      API_GATEWAY_ADDR: :8080
      ORDER_SERVICE_URL: http://order-service:8081
      READ_MODEL_SERVICE_URL: http://read-model-service:8085
    ports:
      - "8080:8080"
    depends_on:
      order-service:
        condition: service_started
      read-model-service:
        condition: service_started

  read-model-service:
    build:
      context: .
      args:
        SERVICE: read-model-service
    container_name: ecommerce-read-model-service
    environment:
      SERVICE_NAME: read-model-service
      HTTP_PORT: 8085
      DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/read_db?sslmode=disable
      KAFKA_GROUP_ID: read-model-service
      READ_MODEL_SERVICE_ADDR: :8085
      READ_DB_HOST: postgres
      READ_DB_PORT: 5432
      READ_DB_USER: ecommerce
      READ_DB_PASSWORD: ecommerce
      READ_DB_NAME: read_db
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  delivery-service:
    build:
      context: .
      args:
        SERVICE: delivery-service
    container_name: ecommerce-delivery-service
    environment:
      SERVICE_NAME: delivery-service
      HTTP_PORT: 8084
      DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/delivery_db?sslmode=disable
      KAFKA_GROUP_ID: delivery-service
      DELIVERY_SERVICE_ADDR: :8084
      DELIVERY_DB_HOST: postgres
      DELIVERY_DB_PORT: 5432
      DELIVERY_DB_USER: ecommerce
      DELIVERY_DB_PASSWORD: ecommerce
      DELIVERY_DB_NAME: delivery_db
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    container_name: ecommerce-payment-service
    environment:
      SERVICE_NAME: payment-service
      HTTP_PORT: 8083
      DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/payment_db?sslmode=disable
      KAFKA_GROUP_ID: payment-service
      PAYMENT_SERVICE_ADDR: :8083
      PAYMENT_DB_HOST: postgres
      PAYMENT_DB_PORT: 5432
      PAYMENT_DB_USER: ecommerce
      PAYMENT_DB_PASSWORD: ecommerce
      PAYMENT_DB_NAME: payment_db
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  inventory-service:
    build:
      context: .
      args:
        SERVICE: inventory-service
    container_name: ecommerce-inventory-service
    environment:
      SERVICE_NAME: inventory-service
      HTTP_PORT: 8082
      DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/inventory_db?sslmode=disable
      KAFKA_GROUP_ID: inventory-service
      INVENTORY_SERVICE_ADDR: :8082
      INVENTORY_DB_HOST: postgres
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_USER: ecommerce
      INVENTORY_DB_PASSWORD: ecommerce
      INVENTORY_DB_NAME: inventory_db
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    container_name: ecommerce-order-service
    environment:
      SERVICE_NAME: order-service
      HTTP_PORT: 8081
      DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/order_db?sslmode=disable
      KAFKA_GROUP_ID: order-service
      ORDER_SERVICE_ADDR: :8081
      ORDER_DB_HOST: postgres
      ORDER_DB_PORT: 5432
      ORDER_DB_USER: ecommerce
      ORDER_DB_PASSWORD: ecommerce
      ORDER_DB_NAME: order_db
      KAFKA_BROKERS: kafka:29092
      OUTBOX_INTERVAL: 500ms
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: ecommerce-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        for topic in orders.events inventory.events payments.events delivery.events notifications.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$topic --partitions 1 --replication-factor 1
        done

volumes:
  postgres_data:
